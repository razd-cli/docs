version: "1"

dependencies:
  using: "mise"
  ensure:
    - "bun@1.3"

tasks:
  default:
    desc: "Установить зависимости и запустить проект"
    cmds:
      - task: install
  install:
    desc: "Install dependencies"
    cmds:
      - bun install
  dev:
    desc: "Start development server"
    cmds:
      - bun run dev
  build:
    desc: "Build for production"
    cmds:
      - bun run build
  start:
    desc: "Start production server"
    cmds:
      - bun run start
  typecheck:
    desc: "Run type checking"
    cmds:
      - bun run types:check
